; ollama-windows-amd64.ini
; Конфигурация для скрипта установки службы Ollama.

[paths]
OllamaDir=D:\AI\Ollama
ModelsDir=D:\AI\Models
NssmDir=C:\Program Files\NSSM
LogsDir=

[ollama]
OllamaHome=

[service]
ServiceName=Ollama
StartType=SERVICE_DELAYED_AUTO_START
StartTimeoutSeconds=60
AppRestartDelay=10000
AddToPath=true

[network]
Host=0.0.0.0
Port=11434
FirewallEnabled=true
FirewallSubnet=192.168.117.0/24
Origins=

[downloads]
; Версия Ollama для установки:
;   latest  — автоматически выбрать самый свежий стабильный релиз
;   ask     — показать интерактивное меню с последними версиями
;   0.40.10 — установить конкретную версию (можно с префиксом v или без)
OllamaVersion=ask
; Резервный URL на случай, если GitHub API недоступен
OllamaUrl=https://github.com/ollama/ollama/releases/download/v0.40.10/ollama-windows-amd64.zip
DownloadCacheDir=
KeepDownloads=true

[models]
DownloadModels=true
Interactive=true
Models=llama3.1:8b,qwen2.5-coder:7b

[performance]
KeepAlive=10m
FlashAttention=1
KvCacheType=q8_0
NumParallel=1
MaxLoadedModels=1
Debug=0
