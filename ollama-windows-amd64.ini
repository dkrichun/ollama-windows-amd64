; ollama-windows-amd64.ini
; Конфигурация для скрипта установки службы Ollama.
; После установки эти параметры передаются службе через NSSM.

[paths]
OllamaDir=D:\AI\Ollama
ModelsDir=D:\AI\Models
NssmDir=C:\Program Files\NSSM
; Каталог для логов NSSM и Ollama. Пусто → <OllamaDir>\logs
LogsDir=

[ollama]
; Домашний каталог профиля Ollama (внутри будет создан .ollama).
; Пусто → совпадает с OllamaDir.
OllamaHome=

[service]
ServiceName=Ollama
; Для GPU-хоста лучше DELAYED_AUTO_START: драйвер CUDA успевает инициализироваться
StartType=SERVICE_DELAYED_AUTO_START
StartTimeoutSeconds=45
; Задержка перед перезапуском после падения (мс)
AppRestartDelay=10000
; Добавить OllamaDir в Machine PATH, чтобы ollama.exe был доступен из любой консоли
AddToPath=true

[network]
; 0.0.0.0 — доступ по сети, 127.0.0.1 — только локально
Host=0.0.0.0
Port=11434

; true/false — создавать правило брандмауэра
FirewallEnabled=true
; Подсеть, которой разрешён доступ. Пусто → правило не создаётся.
FirewallSubnet=192.168.1.0/24

; CORS. Оставьте пустым, если веб-интерфейсы не используются.
; Пример: http://localhost:3000,https://myapp.com
Origins=

[downloads]
NssmUrl=https://github.com/dkxce/NSSM/releases/download/v2.25/NSSM_v2.25.zip
; Актуальный тег проверяйте на https://github.com/ollama/ollama/releases
OllamaUrl=https://github.com/ollama/ollama/releases/download/v0.40.1/ollama-windows-amd64.zip

; Каталог для скачанных архивов. Пусто → папка, где лежит этот скрипт.
; Можно указать относительный путь (например, dist) или абсолютный.
; При следующем запуске архивы переиспользуются, если URL в INI не менялся.
DownloadCacheDir=
; true — сохранять скачанные архивы, false — удалять после распаковки.
KeepDownloads=true

[models]
; Скачивать ли модели при установке.
DownloadModels=true
; Показывать интерактивное меню выбора моделей.
; Если false или запуск с -Force — качаем ровно то, что в Models (ниже).
Interactive=true
; Модели для неинтерактивного режима (через запятую).
; По умолчанию отмечены в меню как «выбранные».
; Для RTX 4060 8 ГБ: 7–8B в Q4_K_M — рабочий диапазон.
Models=llama3.1:8b,qwen2.5-coder:7b

[performance]
; 8 ГБ VRAM: разумный компромисс — 10m. Для фонового сервера можно 24h.
KeepAlive=10m
; Flash Attention обязателен для работы квантованного KV-кэша.
FlashAttention=1
; q8_0 экономит ~50% VRAM под KV-кэш при минимальной потере точности.
; f16 — максимальная точность (по умолчанию).
KvCacheType=q8_0
; 1 — оптимум для одиночного пользователя на 8 ГБ. 2 можно попробовать,
; но каждый слот умножает KV-кэш.
NumParallel=1
; 1 — критично для 8 ГБ: предотвращает OOM при смене модели.
MaxLoadedModels=1
; (Опционально) Включить отладочные логи Ollama. 1 — вкл, 0 — выкл.
Debug=0
