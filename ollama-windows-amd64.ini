; ==============================================================================
; КОНФИГУРАЦИЯ OLLAMA ДЛЯ WINDOWS
; ==============================================================================
; Этот файл читается скриптом ollama-windows-amd64.ps1.
; Все параметры опциональны — при отсутствии используются значения по умолчанию.
; Поддерживаемые типы булевых значений: true/false, 1/0, yes/no, on/off.

; ------------------------------------------------------------------------------
; [paths] — Каталоги
; ------------------------------------------------------------------------------
[paths]
; Каталог для установки бинарников Ollama. Также добавляется в PATH (если AddToPath=true).
OllamaDir=D:\AI\Ollama

; Каталог для хранения скачанных моделей (OLLAMA_MODELS).
; Может занимать десятки гигабайт — убедитесь, что на диске достаточно места.
ModelsDir=D:\AI\Models

; Каталог для распаковки утилиты NSSM (менеджер служб).
; Требуются права администратора для записи.
NssmDir=C:\Program Files\NSSM

; Каталог для логов службы (stdout и stderr).
; Оставьте пустым, чтобы использовать <OllamaDir>\logs.
LogsDir=

; ------------------------------------------------------------------------------
; [ollama] — Профиль Ollama
; ------------------------------------------------------------------------------
[ollama]
; Домашний каталог профиля Ollama. Внутри создается папка .ollama,
; где хранятся ключи (id_ed25519) и некоторые настройки.
; Оставьте пустым, чтобы использовать OllamaDir.
OllamaHome=

; ------------------------------------------------------------------------------
; [service] — Параметры службы Windows
; ------------------------------------------------------------------------------
[service]
; Имя службы Windows (отображается в services.msc).
ServiceName=Ollama

; Тип запуска службы:
;   SERVICE_DELAYED_AUTO_START — отложенный автозапуск (рекомендуется для GPU, чтобы драйвер успел загрузиться)
;   SERVICE_AUTO_START         — обычный автозапуск
;   SERVICE_DEMAND_START       — ручной запуск
StartType=SERVICE_DELAYED_AUTO_START

; Максимальное время ожидания запуска службы (в секундах).
; Увеличьте, если на вашей системе Ollama стартует медленно (например, при первом запуске).
StartTimeoutSeconds=60

; Задержка перед автоматическим перезапуском службы после падения (в миллисекундах).
AppRestartDelay=10000

; Добавить каталог OllamaDir в системную переменную PATH.
; Позволяет запускать команду `ollama` из любой консоли без указания полного пути.
AddToPath=true

; ------------------------------------------------------------------------------
; [network] — Сетевые настройки и брандмауэр
; ------------------------------------------------------------------------------
[network]
; Адрес, на котором слушает API Ollama:
;   0.0.0.0   — доступ по сети (с других устройств)
;   127.0.0.1 — доступ только с локального компьютера
Host=0.0.0.0

; TCP-порт для API.
Port=11434

; Создавать ли правило входящего трафика в брандмауэре Windows.
FirewallEnabled=true

; Подсеть, которой разрешён доступ к API (в формате CIDR).
; Например: 192.168.1.0/24 или 10.0.0.0/8.
; Если оставить пустым, правило брандмауэра создаваться не будет.
FirewallSubnet=192.168.117.0/24

; Список источников (Origin) для CORS.
; Заполните, если используете веб-интерфейсы (Open WebUI, LibreChat и т.д.).
; Пример: http://localhost:3000,https://myapp.com
; Оставьте пустым, если веб-клиенты не используются.
Origins=

; ------------------------------------------------------------------------------
; [downloads] — Скачивание дистрибутивов
; ------------------------------------------------------------------------------
[downloads]
; Версия Ollama для установки:
;   ask     — показать интерактивное меню с последними стабильными версиями с GitHub
;   latest  — автоматически выбрать самый свежий стабильный релиз
;   0.40.10 — установить конкретную версию (можно с префиксом v или без)
OllamaVersion=ask

; Резервный URL для скачивания Ollama на случай, если GitHub API недоступен
; (например, из-за лимита запросов или отсутствия интернета).
OllamaUrl=https://github.com/ollama/ollama/releases/download/v0.40.10/ollama-windows-amd64.zip

; URL для скачивания NSSM.
; По умолчанию используется форк dkxce/NSSM (v2.25).
NssmUrl=https://github.com/dkxce/NSSM/releases/download/v2.25/NSSM_v2.25.zip

; Каталог для сохранения скачанных архивов (кэш).
; Оставьте пустым, чтобы сохранять архивы рядом со скриптом.
; Можно указать относительный путь (например, dist) или абсолютный.
DownloadCacheDir=

; Сохранять ли скачанные архивы после распаковки:
;   true  — архивы остаются на диске и переиспользуются при следующих запусках
;   false — архивы скачиваются во временную папку и удаляются после установки
KeepDownloads=true

; ------------------------------------------------------------------------------
; [models] — Автозагрузка моделей
; ------------------------------------------------------------------------------
[models]
; Скачивать ли модели сразу после успешной установки и запуска службы.
DownloadModels=true

; Показывать интерактивное меню выбора моделей.
; Если false (или при запуске с ключом -Force), будут скачаны только модели из списка Models.
Interactive=true

; Список моделей для скачивания через запятую (для неинтерактивного режима).
; В интерактивном режиме эти модели будут отмечены звездочкой как предвыбранные.
; Рекомендации для RTX 4060 8 ГБ: 7–8B в квантовании Q4_K_M.
Models=llama3.1:8b,qwen2.5-coder:7b

; ------------------------------------------------------------------------------
; [performance] — Параметры производительности Ollama
; ------------------------------------------------------------------------------
[performance]
; Сколько времени модель остаётся в оперативной/видеопамяти после последнего запроса.
; Примеры: 5m (5 минут), 10m, 1h, 24h, -1 (хранить постоянно).
; Для 8 ГБ VRAM рекомендуется 10m.
KeepAlive=10m

; Включить Flash Attention для ускорения инференса (1 — вкл, 0 — выкл).
; ВАЖНО: Обязательно должно быть 1, если KvCacheType отличен от f16.
FlashAttention=1

; Тип квантования KV-кэша:
;   f16  — максимальная точность (использует больше VRAM)
;   q8_0 — экономия ~50% VRAM при минимальной потере точности (рекомендуется)
;   q4_0 — максимальная экономия VRAM, но возможна потеря качества
KvCacheType=q8_0

; Количество одновременных запросов (слотов).
; Каждый слот умножает потребление VRAM под KV-кэш.
; Для одного пользователя на 8 ГБ оптимально значение 1.
NumParallel=1

; Максимальное количество моделей, одновременно находящихся в памяти.
; Для 8 ГБ VRAM критически важно значение 1, чтобы избежать ошибки Out of Memory (OOM)
; при переключении между моделями.
MaxLoadedModels=1

; Включить отладочные логи Ollama (1 — вкл, 0 — выкл).
; Полезно для диагностики проблем с CUDA или запуском.
Debug=0
