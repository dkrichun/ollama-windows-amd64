; ==============================================================================
; КОНФИГУРАЦИЯ OLLAMA ДЛЯ WINDOWS
; ==============================================================================
; Этот файл читается скриптами ollama-windows-install.ps1 и ollama-windows-uninstall.ps1.
; Все параметры опциональны — при отсутствии используются значения по умолчанию.

[paths]
; Каталог для установки бинарников Ollama.
OllamaDir=D:\AI\Ollama

; Каталог для хранения скачанных моделей (OLLAMA_MODELS).
ModelsDir=D:\AI\Models

; Каталог для распаковки утилиты NSSM.
NssmDir=C:\Program Files\NSSM

; Каталог для логов службы. Оставьте пустым для <OllamaDir>\logs.
LogsDir=

; Каталог для сохранения скачанных дистрибутивов (архивов).
; Оставьте пустым, чтобы использовать папку "Downloads" рядом со скриптом.
DownloadsDir=

; Каталог для резервных копий при обновлении.
; Оставьте пустым, чтобы использовать папку "Backup" рядом со скриптом.
BackupDir=

[ollama]
; Домашний каталог профиля Ollama (.ollama). Пусто = OllamaDir.
OllamaHome=

[service]
; Имя службы Windows.
ServiceName=Ollama

; Тип запуска: SERVICE_DELAYED_AUTO_START (рекомендуется), SERVICE_AUTO_START, SERVICE_DEMAND_START.
StartType=SERVICE_DELAYED_AUTO_START

; Максимальное время ожидания запуска службы (в секундах).
StartTimeoutSeconds=60

; Задержка перед перезапуском после падения (мс).
AppRestartDelay=10000

; Добавить каталог OllamaDir в PATH.
AddToPath=true

[network]
; Адрес API: 0.0.0.0 (сеть) или 127.0.0.1 (локально).
Host=0.0.0.0

; TCP-порт.
Port=11434

; Создавать правило брандмауэра.
FirewallEnabled=true

; Подсеть для правила (CIDR). Пусто = правило не создается.
FirewallSubnet=192.168.117.0/24

; CORS (через запятую). Пример: http://localhost:3000
Origins=

[downloads]
; Версия Ollama: ask (меню), latest (последняя), или конкретная (например, 0.40.10).
OllamaVersion=ask

; Резервный URL для скачивания.
OllamaUrl=https://github.com/ollama/ollama/releases/download/v0.40.10/ollama-windows-amd64.zip

; URL для NSSM.
NssmUrl=https://github.com/dkxce/NSSM/releases/download/v2.25/NSSM_v2.25.zip

; Удалять ли архивы после распаковки:
;   false — удалять (экономит место),
;   true  — оставлять в папке Downloads для повторного использования.
KeepDownloads=true

[models]
; Скачивать ли модели после установки.
DownloadModels=true

; Показывать интерактивное меню выбора моделей.
Interactive=true

; Модели для скачивания (через запятую).
Models=llama3.1:8b,qwen2.5-coder:7b

[performance]
; Время хранения модели в памяти (10m, 24h, -1).
KeepAlive=10m

; Включить Flash Attention (1).
FlashAttention=1

; Тип KV-кэша: f16, q8_0, q4_0.
KvCacheType=q8_0

; Количество параллельных слотов.
NumParallel=1

; Максимум моделей в памяти.
MaxLoadedModels=1

; Отладочные логи (1/0).
Debug=0
